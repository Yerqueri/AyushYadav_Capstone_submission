name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-coverage:
    name: Run Unit Tests & Verify Coverage (≥ 90%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_Source_Code
    env:
      OPENAI_API_KEY: "test-mock-key"
      DATABASE_URL: "sqlite:///./storage/decisions.db"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies & Guardrails Hub Validators
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          guardrails hub install hub://guardrails/detect_jailbreak --quiet || true
          guardrails hub install hub://guardrails/detect_prompt_injection --quiet || true
          guardrails hub install hub://guardrails/detect_system_prompt_leakage --quiet || true
          guardrails hub install hub://guardrails/extracted_summary_sentences_match --quiet || true
          guardrails hub install hub://guardrails/bert_toxic --quiet || true
          guardrails hub install hub://guardrails/guardrails_pii --quiet || true

      - name: Run Pytest Suite with Coverage Gate (≥ 90%)
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=90 --cov-report=xml tests/

      - name: Verify Docker Container Build
        run: |
          docker build -t cloudserve-triage:ci .
